// SimpleInit static config for the Kirin970 port.
//
// boot.timeout = -1 disables the bootmenu auto-boot entirely.
// NOTE: 0 means "boot the selected entry IMMEDIATELY" (the menu
// clicks itself as soon as it is drawn), and the default is a 10s
// countdown. Only a negative value makes the menu wait for input.
//
// This file is embedded into the FV (kirin970.fdf) as the RAW section
// "simpleinit.static.uefi.cfg" and picked up by confd_init() because
// PcdConfDefaultStaticPrefix is "\simpleinit.static.uefi".  It is loaded
// with conf_include_file(), i.e. it is *static*: builtin entries in
// bootdef.c do not overwrite keys that already exist here.

boot {
    timeout = -1

    configs {
        //
        // USB 模式.  The port boots in HOST (OTG) mode - KirinDwc3Dxe leaves
        // GCTL.PRTCAPDIR at HOST with XhciDxe bound - so plugging the phone
        // into a PC shows nothing until one of the entries below is picked.
        // (An earlier revision auto-started an idle gadget from an EndOfDxe
        // hook, which made an unattended boot show up as an unknown device.)
        //
        usb-mode {
            mode = "folder"
            desc = "USB Mode"
            show = true
            enabled = true
            icon = "usb"
        }

        // AOSP fastboot running inside UEFI.  KirinFastbootPlatformDxe
        // exposes every partition of the UFS GPT, so from the host:
        //   fastboot flash esp esp.img
        //   fastboot flash boot boot.img
        //   fastboot flash recovery recovery.img
        //   fastboot flash super super.img
        //   fastboot erase userdata
        fastboot {
            mode = "efi"
            desc = "Fastboot (flash UFS partitions)"
            show = true
            enabled = true
            icon = "reboot-fastboot"
            parent = "usb-mode"

            extra {
                // FILE_GUID of EmbeddedPkg/Application/AndroidFastboot
                efi_fv_guid = "9588502a-5370-11e3-8631-d7c5951364c8"
            }
        }

        // Mass storage: the whole UFS LUN0 GPT becomes a removable disk on
        // the PC (BOT / SCSI, read-write).  Backed by the same
        // EFI_BLOCK_IO_PROTOCOL handles the fastboot entries flash.
        mass-storage {
            mode = "efi"
            desc = "Mass Storage (share UFS with PC)"
            show = true
            enabled = true
            icon = "usb"
            parent = "usb-mode"

            extra {
                // FILE_GUID of Silicon/HiSilicon/kirin970/Application/KirinUsbMassStorage
                efi_fv_guid = "c1a7f2d4-3b65-4e0a-9c82-5d7f1e6b4a90"
            }
        }

        // Host (OTG) mode: a USB stick / keyboard plugged into the phone
        // works.  This is also the state the port boots in, so picking it
        // right after boot is a harmless no-op; it matters after a
        // fastboot / mass-storage / device-mode entry has taken the block.
        // Host mode persists after this entry returns to the menu until
        // another USB-mode entry is picked.
        usb-host {
            mode = "efi"
            desc = "USB Host Mode (use USB devices)"
            show = true
            enabled = true
            icon = "usb"
            parent = "usb-mode"

            extra {
                // FILE_GUID of Silicon/HiSilicon/kirin970/Application/KirinUsbHost
                efi_fv_guid = "d2b8e3c5-4c76-4f1b-8d93-6e8a2f7c5b01"
            }
        }

        // Leave host mode: bring up the plain, functionless device gadget.
        // The PC will see an unknown 18d1:ff01 device with no driver bound,
        // which is the "nothing selected" resting state of a gadget.
        // (It used to be 18d1:4ee7, which is a real Google device ID that
        // Windows' android_winusb.inf binds as "ADB Interface".)
        usb-otg {
            mode = "efi"
            desc = "Device Mode (idle gadget, no function)"
            show = true
            enabled = true
            icon = "usb"
            parent = "usb-mode"

            extra {
                // FILE_GUID of Silicon/HiSilicon/kirin970/Application/KirinUsbOtg
                efi_fv_guid = "a5d0b7e2-9c31-4f68-b047-3e6d19c85a72"
            }
        }
        //
        // Kirin970 reboot-menu class selection.
        //
        // bootdef.c groups the vendor-specific reboot entries into
        // sub-folders of the Reboot Menu instead of one flat list:
        //
        //   Reboot Menu
        //     poweroff  reboot  recovery  bootloader  fastbootd   common
        //     Kirin / HiSilicon  ->  factory
        //     Qualcomm           ->  edl
        //     MediaTek           ->  meta
        //
        // Every entry keeps the reboot *argument* upstream ships ("edl",
        // "meta", "factory", ...).  Nothing is translated here:
        // Silicon/HiSilicon/kirin970/Drivers/KirinRebootModeDxe intercepts
        // ResetSystem and does the mapping, so a platform only picks which
        // classes appear on screen - the arguments never need editing.
        //
        // Hiding a class hides its folder, and a child is only ever listed
        // when bm->folder equals its parent, so the entry inside never
        // renders either.
        //
        //   edl   Qualcomm Emergency Download (9008).  Kirin970's image
        //         download paths are test-point entry or the sdupdate /
        //         usbupdate boot reasons, neither of which a menu click
        //         can reach.
        //
        //   meta  MediaTek META mode - mtk_wdt.c WDT_NONRST_REG2 and the
        //         MT6359P RTC spare bits.  No HiSilicon equivalent.
        //
        // Note this works by replacement, not by patching a field: boot.c
        // boot_create_config() bails out when the confd key already exists
        // and cfg->replace is false, so the builtin entry is skipped
        // wholesale.  Every field the builtin would have set therefore has
        // to be restated here.
        //
        reboots-qcom {
            mode = "folder"
            desc = "Qualcomm"
            parent = "reboots"
            show = false
            enabled = false
        }

        reboots-mtk {
            mode = "folder"
            desc = "MediaTek"
            parent = "reboots"
            show = false
            enabled = false
        }
    }
}

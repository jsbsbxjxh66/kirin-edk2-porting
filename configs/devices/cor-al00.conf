SOC_PLATFORM="KIRIN970"
SOC_VENDOR="HiSilicon"
VENDOR_NAME="Honor"
PLATFORM_NAME="cor-al00"

BOOTIMG_OS_PATCH_LEVEL="2020-01"
BOOTIMG_OS_VERSION=9.0.0
BOOTIMG_HEADER_VERSION=1
BOOTIMG_BASE=0x00000000
BOOTIMG_PAGESIZE=2048
BOOTIMG_KERNEL_OFFSET=0x00080000
BOOTIMG_RAMDISK_OFFSET=0x07c00000
BOOTIMG_TAGS_OFFSET=0x07a00000

# Mainline Linux kernel in firmware volume (uncomment to enable)
# 1. Increase FD_SIZE/NumBlocks (see configs/kirin970.conf)
# 2. Set MAINLINE_KERNEL_IN_FV = 1 in
#    Platform/HiSilicon/kirin970/kirin970.dsc [Defines]
# 3. Place files at: mainline/Image.lz4, mainline/kirin970.dtb, mainline/initrd.img
# 4. Uncomment mainline-linux entry in
#    Platform/HiSilicon/kirin970/simpleinit.static.uefi.cfg
#
# Note: build.sh does not forward MAINLINE_KERNEL_IN_FV, so the DSC
# [Defines] line above is the only switch that matters.
